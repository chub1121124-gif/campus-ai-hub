{% extends 'base.html' %}
{% block title %}登入｜校園 AI 學生資訊交換系統{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card auth-card">
    <h1>校園 AI 學生資訊交換系統</h1>
    <p class="muted">一開始進入即為登入畫面。管理員與使用者登入後會依角色分流。</p>

    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label>帳號</label>
        <input type="text" name="username" placeholder="請輸入帳號" required>
      </div>
      <div class="field">
        <label>密碼</label>
        <input type="password" name="password" placeholder="請輸入密碼" required>
      </div>
      <button class="btn btn-primary" type="submit">登入</button>
    </form>

    <div class="space"></div>
    <div class="actions">
      <a class="btn btn-outline" href="{{ url_for('auth.register') }}">沒有帳號？前往註冊</a>
    </div>

    <div class="space"></div>
    <div class="card" style="padding:16px; background:#0f172a;">
      <h3>預設測試帳號</h3>
      <p><strong>管理員：</strong>帳號 admin / 密碼 admin123</p>
      <p><strong>使用者：</strong>帳號 ming / 密碼 user123</p>
    </div>
  </div>
</div>
{% endblock %}
